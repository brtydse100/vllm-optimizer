name: Real GPU smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[runtime,test]"
      - run: nvidia-smi
      - run: python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
      - run: python -m pytest -q tests
      - run: vllm --version
      - run: vllm-opt --help
      - name: Download smoke model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('facebook/opt-125m', local_dir='.gpu-smoke-model')"
      - name: Run real serving and benchmark cycle
        run: vllm-opt -c .github/gpu-smoke.yaml
      - name: Verify smoke artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = list(Path(".gpu-smoke-runs/real-gpu-smoke").glob("*/result.json"))
          assert len(results) == 1, results
          document = json.loads(results[0].read_text(encoding="utf-8"))
          assert document["status"] == "completed", document
          assert document["ranking"], document
          run = results[0].parent
          assert (run / "results.csv").is_file()
          assert (run / "report.html").is_file()
          PY
